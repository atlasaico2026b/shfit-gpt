name: Apply ATLAS SHIFT Theme 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect existing Theme 2 assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          css_anchor = '<link rel="stylesheet" href="./styles.css">'
          css_add = '\n  <link rel="stylesheet" href="./theme-two.css">\n  <link rel="stylesheet" href="./module-table-fix.css">'
          if './theme-two.css' not in s:
              if css_anchor not in s:
                  raise SystemExit('styles.css link not found')
              s = s.replace(css_anchor, css_anchor + css_add, 1)
          script_anchor = '<script src="./app.js" defer></script>'
          script_add = '\n<script src="./theme-two.js" defer></script>'
          if './theme-two.js' not in s:
              if script_anchor not in s:
                  raise SystemExit('app.js script not found')
              s = s.replace(script_anchor, script_anchor + script_add, 1)
          index.write_text(s, encoding='utf-8')

          theme = Path('theme-two.js')
          t = theme.read_text(encoding='utf-8')
          old = "  var KEY='atlasShiftAppTheme';"
          new = "  var KEY='atlasShiftAppTheme', MIGRATION='atlasShiftThemeTwoApplied';"
          if old in t:
              t = t.replace(old, new, 1)
          old2 = "    try{if(localStorage.getItem(KEY)==='theme-two')setTheme();}catch(e){}"
          new2 = "    try{if(localStorage.getItem(MIGRATION)!=='1'){setTheme();localStorage.setItem(MIGRATION,'1');}else if(localStorage.getItem(KEY)==='theme-two')setTheme();}catch(e){}"
          if old2 in t:
              t = t.replace(old2, new2, 1)
          theme.write_text(t, encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html theme-two.js
          git diff --cached --quiet || git commit -m "Connect futuristic Theme 2 and table sizing"
          git push
          rm -f .github/workflows/apply-theme2.yml
          git add -u .github/workflows/apply-theme2.yml
          git diff --cached --quiet || git commit -m "Remove one-shot Theme 2 workflow"
          git push
