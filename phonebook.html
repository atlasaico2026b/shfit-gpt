<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS SHIFT | دفترچه تلفن</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./theme-two.css"></head><body><main class="shell" style="max-width:1250px;margin:30px auto"><section class="hero"><div><div class="kicker">ATLAS SHIFT / دفترچه تلفن</div><h1>دفترچه <span style="color:var(--accent2)">تلفن سازمانی</span></h1><p>حوزه ← شهر ← مجتمع ← واحد ← سمت ← شخص ← شماره‌ها</p></div></section><section class="widget" style="padding:22px"><input id="search" placeholder="جست‌وجوی نام، شماره، داخلی، شهر، مجتمع، واحد یا سمت" style="width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:inherit"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px"><input id="area" placeholder="حوزه"><input id="city" placeholder="شهر"><input id="site" placeholder="مجتمع / مرکز"><input id="unit" placeholder="واحد"><input id="position" placeholder="سمت"><input id="person" placeholder="شخص"></div><div style="margin-top:18px"><button id="add" class="primary-btn">＋ افزودن شخص</button></div><div id="list" style="display:grid;gap:12px;margin-top:18px"></div></section><button class="secondary-btn" onclick="location.href='./index.html'" style="margin-top:15px">بازگشت به داشبورد</button></main><script>(function(){const K='atlasShiftPhonebookV1',$=id=>document.getElementById(id);let data=[];try{data=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=[$('search').value,$('area').value,$('city').value,$('site').value,$('unit').value,$('position').value,$('person').value].join(' ').trim().toLowerCase();const out=data.filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q));$('list').innerHTML=out.length?out.map((x,i)=>'<article class="widget" style="padding:16px"><h3>'+esc(x.person||'بدون نام')+'</h3><p>'+esc([x.position,x.unit,x.site,x.city,x.area].filter(Boolean).join(' · '))+'</p><div>'+esc(x.phones||'شماره‌ای ثبت نشده')+'</div><button class="secondary-btn" data-del="'+i+'" style="margin-top:10px">حذف</button></article>').join(''):'<div class="widget" style="padding:20px">رکوردی ثبت نشده است.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data.splice(Number(b.dataset.del),1);localStorage.setItem(K,JSON.stringify(data));render()})}$('add').onclick=()=>{const person=prompt('نام و نام خانوادگی');if(!person)return;data.push({person,position:prompt('سمت')||'',unit:prompt('واحد')||'',site:prompt('مجتمع / مرکز')||'',city:prompt('شهر')||'',area:prompt('حوزه')||'',phones:prompt('شماره ثابت، داخلی، موبایل و سایر شماره‌ها')||''});localStorage.setItem(K,JSON.stringify(data));render()};['search','area','city','site','unit','position','person'].forEach(id=>$(id).oninput=render);render()})();</script></body></html>
