<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070914">
  <meta name="description" content="ATLAS SHIFT؛ مدیریت محلی پرسنل، شیفت‌ها و مأموریت‌ها با تقویم شمسی">
  <title>ATLAS SHIFT | مدیریت شیفت و پرسنل</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css?v=20261018-6">
  <link rel="stylesheet" href="./visual.css?v=20261018-1">
  <link rel="stylesheet" href="./visual-v2.css?v=20261018-1">
  <link rel="stylesheet" href="./notifications.css?v=20261018-1">
  <link rel="stylesheet" href="./calendar.css?v=20261018-1">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar glass">
      <a class="brand" href="#" aria-label="صفحه اصلی"><span class="brand-mark"><span></span><span></span><span></span></span><span><strong>ATLAS SHIFT</strong><small>سامانه مدیریت نیروی انسانی</small></span></a>
      <div class="sidebar-label">فضای کاری</div>
      <nav class="main-nav" aria-label="ناوبری اصلی">
        <button type="button" class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span>داشبورد</span></button>
        <button type="button" class="nav-item" data-view="employees"><span class="nav-icon">♙</span><span>کارکنان</span></button>
        <button type="button" class="nav-item" data-view="missions"><span class="nav-icon">↗</span><span>مأموریت‌ها</span></button>
        <button type="button" class="nav-item" data-view="leaves"><span class="nav-icon">◷</span><span>مرخصی‌ها</span></button>
        <button type="button" class="nav-item" data-view="vehicles"><span class="nav-icon">▰</span><span>خودروها</span></button>
        <button type="button" class="nav-item" data-view="gasmeters"><span class="nav-icon">◉</span><span>گازسنج‌ها</span></button>
        <button type="button" class="nav-item" data-view="notes"><span class="nav-icon">▤</span><span>یادداشت‌ها</span></button>
        <button type="button" class="nav-item" data-view="reports"><span class="nav-icon">▥</span><span>گزارشات</span></button>
        <button type="button" class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>تنظیمات</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="local-card"><span class="local-dot"></span><div><strong>حالت محلی</strong><small>اطلاعات روی همین دستگاه</small></div></div>
      <div class="sidebar-footer">نسخه 0.1.0 · پیش‌نمایش اولیه</div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="topbar-heading"><div class="eyebrow"><span class="status-pulse"></span> مرکز عملیات نیروی انسانی</div><h1 id="page-title">نمای کلی</h1><p id="page-subtitle">وضعیت امروز و برنامه پیشِ رو</p></div></header>
      <section id="view-root" aria-live="polite"></section>
      <footer class="main-footer"><span>ATLAS SHIFT</span><span>طراحی‌شده برای کار آفلاین و مدیریت روزانه</span></footer>
    </main>
  </div>
  <div id="modal-root"></div><div id="toast-region" class="toast-region" role="status" aria-live="polite"></div><input type="file" id="restore-input" accept="application/json,.json" hidden>
  <script>
    (function(){
      function showAppError(message){
        var root=document.getElementById('view-root'); if(!root)return;
        var box=document.createElement('div'); box.className='panel'; box.style.margin='16px 0'; box.style.borderColor='rgba(255,156,200,.45)';
        var heading=document.createElement('strong'); heading.textContent='برنامه کامل بارگذاری نشد';
        var detail=document.createElement('p'); detail.style.color='#ffb8d8'; detail.style.fontSize='12px'; detail.textContent=message||'فایل برنامه بارگذاری نشد.';
        box.appendChild(heading); box.appendChild(detail); root.replaceChildren(box);
      }
      window.addEventListener('error',function(event){
        if(event&&event.target&&event.target.tagName==='SCRIPT'&&event.target.src){showAppError('فایل JavaScript بارگذاری نشد: '+event.target.src);}
        else if(event&&event.message){showAppError('خطای اجرا: '+event.message);}
      },true);
      window.addEventListener('unhandledrejection',function(event){showAppError('خطای اجرای برنامه: '+(event&&event.reason&&event.reason.message?event.reason.message:'خطای ناشناخته'));});
      window.__atlasShiftShowError=showAppError;
    })();
  </script>
  <script src="./app.js?v=20261018-7" defer onerror="window.__atlasShiftShowError&&window.__atlasShiftShowError('فایل app.js دریافت نشد.')"></script>
  <script src="./visual.js?v=20261018-2" defer></script>
  <script src="./notifications.js?v=20261018-1" defer onerror="window.__atlasShiftShowError&&window.__atlasShiftShowError('فایل notifications.js دریافت نشد.')"></script>
  <script src="./calendar.js?v=20261018-1" defer onerror="window.__atlasShiftShowError&&window.__atlasShiftShowError('فایل calendar.js دریافت نشد.')"></script>
</body>
</html>
