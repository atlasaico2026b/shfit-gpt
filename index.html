<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a35">
  <meta name="description" content="ATLAS SHIFT؛ مدیریت محلی پرسنل، شیفت‌ها و مأموریت‌ها با تقویم شمسی">
  <title>ATLAS SHIFT | مدیریت شیفت و پرسنل</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar glass">
      <a class="brand" href="#" aria-label="صفحه اصلی">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span><strong>ATLAS SHIFT</strong><small>سامانه مدیریت نیروی انسانی</small></span>
      </a>
      <div class="sidebar-label">فضای کاری</div>
      <nav class="main-nav" aria-label="ناوبری اصلی">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span>نمای کلی</span></button>
        <button class="nav-item" data-view="calendar"><span class="nav-icon">▦</span><span>تقویم شمسی</span></button>
        <button class="nav-item" data-view="schedule"><span class="nav-icon">◷</span><span>برنامه کاری</span></button>
        <button class="nav-item" data-view="employees"><span class="nav-icon">♙</span><span>پرسنل</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>تنظیمات</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="local-card">
        <span class="local-dot"></span>
        <div><strong>حالت محلی</strong><small>اطلاعات روی همین دستگاه</small></div>
      </div>
      <button class="nav-item backup-nav" data-action="backup"><span class="nav-icon">⇩</span><span>پشتیبان‌گیری</span></button>
      <div class="sidebar-footer">نسخه 0.1.0 · پیش‌نمایش اولیه</div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-heading">
          <div class="eyebrow"><span class="status-pulse"></span> مرکز عملیات نیروی انسانی</div>
          <h1 id="page-title">نمای کلی</h1>
          <p id="page-subtitle">وضعیت امروز و برنامه پیشِ رو</p>
        </div>
        <div class="topbar-actions">
          <div class="date-chip"><span class="date-chip-icon">◷</span><span id="today-label">—</span></div>
          <button class="button button-primary" data-action="add-entry"><span class="button-plus">＋</span> ثبت برنامه</button>
        </div>
      </header>
      <section id="view-root" aria-live="polite"></section>
      <footer class="main-footer"><span>ATLAS SHIFT</span><span>طراحی‌شده برای کار آفلاین و مدیریت روزانه</span></footer>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <input type="file" id="restore-input" accept="application/json,.json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
