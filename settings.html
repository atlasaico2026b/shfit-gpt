<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS SHIFT | تنظیمات</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./theme-two.css"></head><body><main class="shell" style="max-width:1200px;margin:30px auto"><section class="hero"><div><div class="kicker">ATLAS SHIFT / تنظیمات</div><h1>مدیریت <span style="color:var(--accent2)">ظاهر و تنظیمات</span></h1><p>همه تغییرات روی همین دستگاه ذخیره می‌شوند.</p></div></section><section class="widget" style="padding:22px"><h2>🎨 تم و رنگ</h2><p>رنگ‌ها و شدت جلوه‌های بصری را تغییر بده.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px"><label>رنگ اصلی<input id="c1" type="color" value="#168bff" style="width:100%;height:48px"></label><label>رنگ دوم<input id="c2" type="color" value="#24cbe0" style="width:100%;height:48px"></label><label>رنگ سوم<input id="c3" type="color" value="#a778ff" style="width:100%;height:48px"></label></div><label style="display:block;margin-top:18px">شدت جلوه‌ها <output id="ov">32%</output><input id="opacity" type="range" min="5" max="60" value="32" style="width:100%"></label><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button id="saveTheme" class="primary-btn">اعمال ظاهر</button><button id="resetTheme" class="secondary-btn">بازنشانی</button></div></section><section class="widget" style="padding:22px;margin-top:16px"><h2>🎙️ مدیریت دستیار صوتی</h2><div style="display:grid;gap:12px;margin-top:15px"><label><input id="voiceEnabled" type="checkbox"> فعال بودن دستیار صوتی</label><label><input id="voiceInput" type="checkbox"> دریافت فرمان صوتی</label><label><input id="voiceReply" type="checkbox"> پاسخ صوتی</label><label>سیاست تأیید عملیات حساس<select id="confirmPolicy"><option>همیشه تأیید شود</option><option>فقط عملیات حساس</option><option>بدون تأیید</option></select></label></div><button id="saveVoice" class="primary-btn" style="margin-top:18px">ذخیره تنظیمات دستیار</button></section><section class="widget" style="padding:22px;margin-top:16px"><h2>🧩 تنظیمات رابط</h2><p>چیدمان پنجره‌ها و بخش‌های شناور در نسخه اصلی از همین منطق محلی استفاده می‌کنند.</p><button class="secondary-btn" onclick="location.href='./index.html'">بازگشت به داشبورد</button></section></main><script>(function(){const K='atlasShiftAppearanceV1',V='atlasShiftVoiceSettingsV1', $=id=>document.getElementById(id);let a={};try{a=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}['c1','c2','c3'].forEach((id,i)=>$(id).value=a.colors?.[i]||$(id).value);$('opacity').value=a.opacity||32;$('ov').textContent=$('opacity').value+'%';$('opacity').oninput=()=>{$('ov').textContent=$('opacity').value+'%'};function hex(h){h=h.replace('#','');return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)}function apply(){document.documentElement.style.setProperty('--accent',$('c1').value);document.documentElement.style.setProperty('--accent2',$('c2').value);document.documentElement.style.setProperty('--cloud-opacity',Number($('opacity').value)/100);document.documentElement.style.setProperty('--accent-rgb',hex($('c1').value));document.documentElement.style.setProperty('--accent2-rgb',hex($('c2').value));localStorage.setItem(K,JSON.stringify({colors:[$('c1').value,$('c2').value,$('c3').value],opacity:Number($('opacity').value)}))}$('saveTheme').onclick=apply;$('resetTheme').onclick=()=>{localStorage.removeItem(K);location.reload()};let v={};try{v=JSON.parse(localStorage.getItem(V)||'{}')}catch(e){}$('voiceEnabled').checked=v.enabled!==false;$('voiceInput').checked=v.input!==false;$('voiceReply').checked=!!v.reply;$('confirmPolicy').value=v.policy||'فقط عملیات حساس';$('saveVoice').onclick=()=>{localStorage.setItem(V,JSON.stringify({enabled:$('voiceEnabled').checked,input:$('voiceInput').checked,reply:$('voiceReply').checked,policy:$('confirmPolicy').value}));alert('تنظیمات دستیار صوتی ذخیره شد.')}apply()})();</script></body></html>
