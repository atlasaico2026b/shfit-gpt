// Android wrapper build configuration for ATLAS SHIFT.
// CI packaging configuration revision 2.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atlas.shift'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atlas.shift'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
